<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Bağışdaaa Oyun Şousu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-110vh) scale(1.5) rotate(360deg);
        opacity: 0;
      }
    }
    .floating-item {
      position: fixed;
      bottom: -50px;
      pointer-events: none;
      z-index: 50;
      animation: floatUp 3.5s ease-out forwards;
    }
    @keyframes slideInLeft {
      0% {
        transform: translateX(-100%);
        opacity: 0;
      }
      100% {
        transform: translateX(0);
        opacity: 1;
      }
    }
    
    /* Sol tərəfdən gələn mesajlar üçün qəşəng çəhrayı naxışlı/gradient dizayn */
    .chat-bubble {
      animation: slideInLeft 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      background: linear-gradient(135deg, #ffb6c1 0%, #ff8da1 100%);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      color: #700f28;
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.35);
      background-image: radial-gradient(rgba(255, 255, 255, 0.4) 1px, transparent 1px);
      background-size: 8px 8px;
    }

    /* Yuxarıdan yalnız 🌸 və Nigarrr düşməsi üçün animasiya */
    @keyframes fallDown {
      0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0.25;
      }
    }
    .falling-item-custom {
      position: fixed;
      top: -50px;
      pointer-events: none;
      z-index: 1;
      animation: fallDown linear forwards;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-pink-100 via-purple-100 to-rose-200 min-h-screen flex flex-col items-center justify-center p-4 font-sans antialiased overflow-x-hidden selection:bg-pink-300">

  <!-- Yuxarıdan tökülən 🌸 və Nigarrr konteyneri -->
  <div id="fallingContainer" class="fixed inset-0 pointer-events-none z-0 overflow-hidden"></div>

  <!-- Sol tərəfdən gələn Nigar mesajları -->
  <div id="chatContainer" class="fixed top-4 left-4 z-40 flex flex-col gap-2 max-w-[260px] sm:max-w-xs pointer-events-none"></div>

  <!-- Uçan Ürək və Smiling Face konteyneri -->
  <div id="heartsContainer" class="fixed inset-0 pointer-events-none z-50 overflow-hidden"></div>

  <!-- Əsas Kart -->
  <main class="w-full max-w-md bg-white/80 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-2xl border border-white/50 text-center my-auto relative z-10 transition-all duration-300">
    
    <!-- SVG Obraz -->
    <div class="relative w-32 h-32 mx-auto mb-4">
      <svg id="characterSvg" viewBox="0 0 100 100" class="w-full h-full drop-shadow-md transition-transform duration-300 hover:scale-105">
        <circle cx="50" cy="50" r="45" fill="#FFB6C1" />
        <ellipse cx="35" cy="38" rx="8" ry="5" fill="#FFF" />
        <ellipse cx="65" cy="38" rx="8" ry="5" fill="#FFF" />
        <circle id="leftPupil" cx="35" cy="38" r="3.5" fill="#2D3748" />
        <circle id="rightPupil" cx="65" cy="38" r="3.5" fill="#2D3748" />
        <ellipse cx="25" cy="52" rx="6" ry="3" fill="#FF69B4" opacity="0.6" />
        <ellipse cx="75" cy="52" rx="6" ry="3" fill="#FF69B4" opacity="0.6" />
        <path id="mouth" d="M 38 62 Q 50 68 62 62" stroke="#2D3748" stroke-width="3.5" stroke-linecap="round" fill="none" />
      </svg>
    </div>

    <!-- Nəticə/Yazı Hissəsi -->
    <div id="messageArea" class="min-h-[70px] flex items-center justify-center mb-6">
      <h1 id="mainTitle" class="text-xl sm:text-2xl font-extrabold text-gray-800 leading-snug">
        Nigarrrr bağışdaaa üzür isdiyirəmmmm :(
      </h1>
    </div>

    <!-- Düymələr -->
    <div id="buttonsArea" class="flex flex-col items-center justify-center gap-3 w-full">
      
      <!-- 1. Bağışdaaa -->
      <button id="yesBtn" onclick="handleYes()" class="w-full bg-gradient-to-r from-emerald-400 to-teal-500 hover:from-emerald-500 hover:to-teal-600 text-white font-bold py-3 px-6 rounded-2xl shadow-lg hover:shadow-xl active:scale-95 transition-all text-lg">
        1. Bağışdaaa :)
      </button>

      <!-- 2. Bağışdama -->
      <a id="noBtn" href="https://www.instagram.com/direct/t/shmrd01" target="_blank" onclick="openNormalInstagram(event)" class="w-full bg-gradient-to-r from-rose-400 to-red-500 hover:from-rose-500 hover:to-red-600 text-white font-bold py-3 px-6 rounded-2xl shadow-lg hover:shadow-xl active:scale-95 transition-all text-lg text-center block">
        2. Bağışdama :(
      </a>

      <!-- 3. Redd et və vur -->
      <button id="beatBtn" onclick="handleBeat()" class="w-full bg-gradient-to-r from-purple-500 to-indigo-600 hover:from-purple-600 hover:to-indigo-700 text-white font-bold py-3 px-6 rounded-2xl shadow-lg hover:shadow-xl active:scale-95 transition-all text-lg">
        3. Redd et və vur 🫵
      </button>

    </div>

  </main>

  <script>
    const instagramUsername = "shmrd01";

    // Yalnız 🌸 və Nigarrr yağışı
    function startFallingCustomItems() {
      const container = document.getElementById('fallingContainer');
      const items = ['🌸', 'Nigarrr'];

      setInterval(() => {
        const el = document.createElement('div');
        const chosen = items[Math.floor(Math.random() * items.length)];
        
        el.className = 'falling-item-custom select-none font-bold';
        el.innerText = chosen;
        
        if (chosen === 'Nigarrr') {
          el.className += ' text-pink-700 text-base sm:text-lg bg-pink-200/80 px-2.5 py-1 rounded-xl shadow-sm border border-pink-300';
        } else {
          el.className += ' text-2xl sm:text-3xl';
        }

        el.style.left = Math.random() * 92 + '%';
        
        const duration = 4 + Math.random() * 3;
        el.style.animationDuration = duration + 's';
        
        container.appendChild(el);

        setTimeout(() => {
          el.remove();
        }, duration * 1000);
      }, 400);
    }

    // Səs Effektləri
    function playAudioTone(freq, type, duration) {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch(e) {}
    }

    function playHappySound() {
      playAudioTone(523.25, 'triangle', 0.15);
      setTimeout(() => playAudioTone(659.25, 'triangle', 0.15), 120);
      setTimeout(() => playAudioTone(783.99, 'triangle', 0.3), 240);
    }

    // Sol tərəfdən Nigar mesajlarının gəlməsi
    function startNigarMessages() {
      const container = document.getElementById('chatContainer');
      let rCount = 1;
      let increasing = true;

      setInterval(() => {
        const bubble = document.createElement('div');
        bubble.className = "chat-bubble px-4 py-2 rounded-2xl rounded-tl-none text-sm font-bold text-left";
        
        const rString = "r".repeat(rCount);
        bubble.innerText = `Niga${rString}`;
        
        container.appendChild(bubble);

        if (container.children.length > 5) {
          container.removeChild(container.firstChild);
        }

        if (increasing) {
          rCount++;
          if (rCount >= 10) increasing = false;
        } else {
          rCount--;
          if (rCount <= 1) increasing = true;
        }
      }, 1200);
    }

    // 1. Bağışdaaa Basıldıqda
    function handleYes() {
      playHappySound();

      document.getElementById('mouth').setAttribute('d', 'M 35 55 Q 50 75 65 55');

      const messageArea = document.getElementById('messageArea');
      messageArea.innerHTML = `
        <h1 class="text-3xl sm:text-4xl font-black text-pink-600 animate-bounce">
          Yupiiiiiiii :)
        </h1>
      `;

      if (typeof confetti === 'function') {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: { y: 0.6 }
        });
      }

      createFloatingElements();
    }

    // Ürəklər və :) simvolları
    function createFloatingElements() {
      const container = document.getElementById('heartsContainer');
      const items = ['❤️', '💖', '💕', ':)', '😊', '💗', '✨', '🥰'];

      for (let i = 0; i < 35; i++) {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'floating-item text-2xl sm:text-3xl font-bold select-none';
          el.innerText = items[Math.floor(Math.random() * items.length)];
          el.style.left = Math.random() * 90 + 5 + '%';
          el.style.animationDuration = (2.5 + Math.random() * 2) + 's';
          
          if (el.innerText === ':)') {
            el.style.color = '#db2777';
          }

          container.appendChild(el);

          setTimeout(() => {
            el.remove();
          }, 4500);
        }, i * 80);
      }
    }

    // 2. Bağışdama düyməsi (adi keçid)
    function openNormalInstagram(event) {
      event.preventDefault();
      const isAndroid = /Android/i.test(navigator.userAgent);
      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isAndroid) {
        window.location.href = `intent://direct/t/${instagramUsername}#Intent;package=com.instagram.android;scheme=instagram;end`;
      } else if (isIOS) {
        window.location.href = `instagram://direct/t/${instagramUsername}`;
        setTimeout(() => {
          window.location.href = `https://www.instagram.com/direct/t/${instagramUsername}/`;
        }, 1200);
      } else {
        window.open(`https://www.instagram.com/direct/t/${instagramUsername}/`, '_blank');
      }
    }

    // 3. Redd et və vur düyməsi (Vibrasiya + Ekranda ürəkli yazı)
    function handleBeat() {
      // Telefonu titrətmək (Vibrasiya)
      if ("vibrate" in navigator) {
        navigator.vibrate([200, 100, 200, 100, 300]);
      }

      // Obrazın ağzını kədərli/təəccüblü etmək
      document.getElementById('mouth').setAttribute('d', 'M 38 68 Q 50 55 62 68');

      // Ekranda ürək ilə olan yazı
      const messageArea = document.getElementById('messageArea');
      messageArea.innerHTML = `
        <h1 class="text-xl sm:text-2xl font-black text-rose-600 animate-pulse">
          Məni vurmazsan bilirəm :) ❤️
        </h1>
      `;
    }

    window.addEventListener('DOMContentLoaded', () => {
      startNigarMessages();
      startFallingCustomItems();
    });
  </script>
</body>
</html>
